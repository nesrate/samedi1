<script>
// متغيرات لتتبع النقاط المحددة
let selectedPoints = new Set();
let lastSelectedIndex = null;

// ===== إلغاء تحديد جميع النقاط =====
function deselectAllPoints() {
    const allPoints = document.querySelectorAll('.point');
    allPoints.forEach(point => {
        const checkbox = point.querySelector('.point-checkbox');
        checkbox.checked = false;
        selectedPoints.delete(point);
        point.classList.remove('selected');
    });
    lastSelectedIndex = null;
    updateSelectedCount();
}

// ===== إضافة POINT(S) TROUVÉ(S)  DXF =====
function addPoint(title = "", x = "", y = "") {
    const pointsDiv = document.getElementById("points");
    const div = document.createElement("div");
    div.className = "point";
    div.innerHTML = `
        <input type="checkbox" class="point-checkbox" onclick="handleCheckboxClick(this, event)">
        BORNE: <input type="text" name="title[]" value="${title}" placeholder="B.1, WT2..." class="title-input" required>
        X: <input type="number" step="any" name="x[]" value="${x}" class="coord-input" required>
        Y: <input type="number" step="any" name="y[]" value="${y}" class="coord-input" required>
    `;

    pointsDiv.appendChild(div);
    updatePointsCount();
}



// ===== التعامل مع نقرة checkbox =====
function handleCheckboxClick(checkbox, event) {
    // منع انتشار الحدث لتجنب إلغاء التحديد عند النقر على checkbox
    event.stopPropagation();

    const pointDiv = checkbox.closest('.point');
    const index = Array.from(document.getElementById("points").children).indexOf(pointDiv);

    if(event.shiftKey && lastSelectedIndex !== null) {
        // تحديد نطاق من النقاط (Shift + click)
        const start = Math.min(lastSelectedIndex, index);
        const end = Math.max(lastSelectedIndex, index);
        const allPoints = document.querySelectorAll('.point');

        for(let i = start; i <= end; i++) {
            const cb = allPoints[i].querySelector('.point-checkbox');
            cb.checked = checkbox.checked;
            if(checkbox.checked) {
                selectedPoints.add(allPoints[i]);
                allPoints[i].classList.add('selected');
            } else {
                selectedPoints.delete(allPoints[i]);
                allPoints[i].classList.remove('selected');
            }
        }
    } else {
        // تحديد POINT(S) TROUVÉ(S)  واحدة
        if(checkbox.checked) {
            // إلغاء تحديد جميع النقاط الأخرى
            deselectAllPoints();
            // تحديد الPOINT(S) TROUVÉ(S)  الحالية
            checkbox.checked = true;
            selectedPoints.add(pointDiv);
            pointDiv.classList.add('selected');
            lastSelectedIndex = index;
        } else {
            selectedPoints.delete(pointDiv);
            pointDiv.classList.remove('selected');
            if(lastSelectedIndex === index) {
                lastSelectedIndex = null;
            }
        }
    }

    updateSelectedCount();
}

// ===== تحديد أو إلغاء تحديد كل النقاط =====
function toggleSelectAll() {
    const allPoints = document.querySelectorAll('.point');
    const someUnselected = Array.from(allPoints).some(point => !selectedPoints.has(point));

    // إلغاء تحديد الكل أولاً
    deselectAllPoints();

    if(someUnselected) {
        // تحديد الكل
        allPoints.forEach(point => {
            const checkbox = point.querySelector('.point-checkbox');
            checkbox.checked = true;
            selectedPoints.add(point);
            point.classList.add('selected');
        });
        lastSelectedIndex = null;
    }

    updateSelectedCount();
}

// ===== تحديث عدد النقاط المحددة =====
function updateSelectedCount() {
    const count = selectedPoints.size;
    const pointsCountSpan = document.getElementById("pointsCount");
    const totalPoints = document.querySelectorAll('.point').length;
    if(count > 0) {
        pointsCountSpan.innerHTML = `${totalPoints} POINT(S) TROUVÉ(S)  | ${count} Sélectionné(s)
`;
        //pointsCountSpan.style.backgroundColor = "#27ae60";
    } else {
        pointsCountSpan.innerHTML = `${totalPoints} POINT(S) TROUVÉ(S) `;
        //pointsCountSpan.style.backgroundColor = "#3498db";
    }
}

// ===== تحديث عدد النقاط الكلي =====
function updatePointsCount() {
    const totalPoints = document.querySelectorAll('.point').length;
    const selectedCount = selectedPoints.size;
    const pointsCountSpan = document.getElementById("pointsCount");

    if(selectedCount > 0) {
        pointsCountSpan.innerHTML = `${totalPoints} POINT(S) TROUVÉ(S)  | ${selectedCount} Sélectionné(s)
`;
        //pointsCountSpan.style.backgroundColor = "#27ae60";
    } else {
        pointsCountSpan.innerHTML = `${totalPoints} POINT(S) TROUVÉ(S) `;
        //pointsCountSpan.style.backgroundColor = "#3498db";
    }
}

// ===== حذف النقاط المحددة =====
function deleteSelectedPoints() {
    if(selectedPoints.size === 0) {
        alert("⚠️ الرجاء تحديد النقاط التي تريد حذفها أولاً!");
        return;
    }

    // تجميع أسماء النقاط للتأكيد
    const titles = [];
    selectedPoints.forEach(point => {
        const titleInput = point.querySelector('.title-input');
        titles.push(titleInput.value);
    });

    const message = `⚠️ Êtes-vous sûr de vouloir supprimer ce point ?`;
//    const message = ` ⚠️ ⚠️ Êtes-vous sûr de vouloir supprimer ce point ? ${selectedPoints.size} POINT(S) ؟\n\nPOINTT(S):\n${titles.join('\n')}`;


    if(confirm(message)) {
        selectedPoints.forEach(point => {
            point.remove();
        });
        selectedPoints.clear();
        updatePointsCount();
        updateSelectedCount();
        lastSelectedIndex = null;
    }
}

// ===== تحريك النقاط المحددة =====
function moveSelectedPoints(direction) {
    if(selectedPoints.size === 0) {
        alert("⚠️ الرجاء تحديد النقاط التي تريد تحريكها أولاً!");
        return;
    }

    const pointsDiv = document.getElementById("points");
    const allPoints = Array.from(pointsDiv.children);

    // تحويل Set إلى Array وفرز حسب الموضع
    const selectedArray = Array.from(selectedPoints);
    selectedArray.sort((a, b) => allPoints.indexOf(a) - allPoints.indexOf(b));

    if(direction === 'up') {
        // التحريك لأعلى: أول POINT(S) TROUVÉ(S)  محددة لا يمكن تحريكها لأعلى إذا كانت في البداية
        const firstSelectedIndex = allPoints.indexOf(selectedArray[0]);
        if(firstSelectedIndex === 0) {
            alert("⚠️ لا يمكن تحريك النقاط لأعلى أكثر من هذا!");
            return;
        }

        // تحريك كل POINT(S) TROUVÉ(S)  محددة لأعلى
        for(let i = 0; i < selectedArray.length; i++) {
            const currentIndex = allPoints.indexOf(selectedArray[i]);
            if(currentIndex > 0) {
                const previousPoint = allPoints[currentIndex - 1];
                // إذا كانت الPOINT(S) TROUVÉ(S)  السابقة محددة أيضاً، تخطي
                if(!selectedPoints.has(previousPoint)) {
                    pointsDiv.insertBefore(selectedArray[i], previousPoint);
                }
            }
        }
    }
    else if(direction === 'down') {
        // التحريك لأسفل: آخر POINT(S) TROUVÉ(S)  محددة لا يمكن تحريكها لأسفل إذا كانت في النهاية
        const lastSelectedIndex = allPoints.indexOf(selectedArray[selectedArray.length - 1]);
        if(lastSelectedIndex === allPoints.length - 1) {
            alert("⚠️ لا يمكن تحريك النقاط لأسفل أكثر من هذا!");
            return;
        }

        // تحريك كل POINT(S) TROUVÉ(S)  محددة لأسفل (من الأسفل للأعلى)
        for(let i = selectedArray.length - 1; i >= 0; i--) {
            const currentIndex = allPoints.indexOf(selectedArray[i]);
            if(currentIndex < allPoints.length - 1) {
                const nextPoint = allPoints[currentIndex + 1];
                if(!selectedPoints.has(nextPoint)) {
                    pointsDiv.insertBefore(nextPoint, selectedArray[i]);
                }
            }
        }
    }

    // إعادة ترتيب allPoints بعد التغيير
    const newAllPoints = Array.from(pointsDiv.children);

    // تحديث المراجع في selectedPoints
    const newSelected = new Set();
    selectedArray.forEach(oldPoint => {
        const newIndex = newAllPoints.indexOf(oldPoint);
        if(newIndex !== -1) {
            newSelected.add(oldPoint);
        }
    });
    selectedPoints.clear();
    newSelected.forEach(point => selectedPoints.add(point));

    updatePointsCount();
    updateSelectedCount();
}

// ===== تحريك النقاط بالكيبورد =====
function handleKeyboardMove(event) {
    if(event.key === 'ArrowUp') {
        event.preventDefault();
        moveSelectedPoints('up');
    } else if(event.key === 'ArrowDown') {
        event.preventDefault();
        moveSelectedPoints('down');
    } else if(event.key === 'Delete' || event.key === 'Del') {
        event.preventDefault();
        deleteSelectedPoints();
    } else if(event.key === 'a' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        toggleSelectAll();
    } else if(event.key === 'Escape' || event.key === 'Esc') {
        event.preventDefault();
        deselectAllPoints();
    }
}

// ===== النقر على الصفحة لإلغاء التحديد =====
function handlePageClick(event) {
    // التحقق إذا كان النقر على checkbox أو على أي عنصر داخل الPOINT(S) TROUVÉ(S)
    const isPointElement = event.target.closest('.point');
    const isButton = event.target.closest('button');
    const isTextarea = event.target.closest('textarea');
    const isInput = event.target.closest('input');

    // إذا كان النقر على checkbox أو زر أو textarea أو input، لا نلغِ التحديد
    if(isPointElement && event.target.type === 'checkbox') {
        return;
    }
    if(isButton || isTextarea || isInput) {
        return;
    }

    // إلغاء تحديد جميع النقاط
    deselectAllPoints();
}

// ===== تصحيح OCR العناوين =====
function fixOcrTitles(text){
    const lines = text.split(/\r?\n/);
    const fixed = lines.map(line => {
        line = line.trim();
        if(/^8\./.test(line)) return line.replace(/^8/,"B");
        if(/^8\d/.test(line)) return line.replace(/^8/,"B");
        if(/^8[A-Z]/.test(line)) return line.replace(/^8/,"B");
        return line;
    });
    return fixed.join("\n");
}

// ===== تحويل النص إلى نقاط =====

function parseTextareaFromText(text) {

    if (!text) return;

    const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l);

    document.getElementById("points").innerHTML = "";
    selectedPoints.clear();

    let i = 0;

    while (i < lines.length - 2) {

        const title = lines[i];

        // تنظيف X و Y
        let x = lines[i + 1].replace(/\s+/g, '');
        let y = lines[i + 2].replace(/\s+/g, '');

        // التحقق أنهم أرقام
        const validX = /^[0-9]+(\.[0-9]+)?$/.test(x);
        const validY = /^[0-9]+(\.[0-9]+)?$/.test(y);

        if (validX && validY) {

            addPoint(title, x, y);

            i += 3;

        } else {

            i++;
        }
    }

    updatePointsCount();
}

// ===== الفلترة والتحويل (الحفاظ على محتوى textarea الأصلي) =====
async function filterAndParse() {
    const input = document.getElementById("input");

    if(!input) return;

    // حفظ المحتوى الأصلي
    const originalText = input.value;

    // تصحيح OCR
    let correctedText = fixOcrTitles(originalText);

    // إرسال للفلترة
    const res = await fetch("/filter2", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: correctedText
        })
    });

    const data = await res.json();

    // تحويل النص المفلتر إلى نقاط فقط
    parseTextareaFromText(data.result);

    // رسالة تأكيد
    console.log("تم تحديث النقاط مع الحفاظ على النص الأصلي في textarea");
}

// ===== إضافة POINT(S) TROUVÉ(S)  فارغة جديدة =====
function addEmptyPoint() {
    addPoint("", "", "");
}

// ===== تنفيذ تلقائي عند تحميل الصفحة =====
window.onload = () => {
    addEmptyPoint();
    const input = document.getElementById("input");
    if(input){
        filterAndParse();
    }

    // إضافة مستمع للأحداث للكيبورد
    document.addEventListener('keydown', handleKeyboardMove);

    // إضافة مستمع للنقر على الصفحة
    document.addEventListener('click', handlePageClick);
};

function startLoading(){
    let box = document.getElementById("loadingBox");
    box.style.display = "block";
}
</script>

<script>
const LIMIT = 13;
const WINDOW = 24 * 60 * 60 * 1000;

const form = document.getElementById("dxfForm");
const btn = document.querySelector(".download_dxf");

if (form && btn) {

    function getLimitData() {
        return JSON.parse(localStorage.getItem("dxf_limit")) || {
            count: 0,
            startTime: null
        };
    }

    function saveLimitData(data) {
        localStorage.setItem("dxf_limit", JSON.stringify(data));
    }

    function formatTime(ms) {
        let s = Math.floor(ms / 1000);
        let h = Math.floor(s / 3600);
        let m = Math.floor((s % 3600) / 60);
        let sec = s % 60;
        return `${h}h ${m}m ${sec}s`;
    }

    function canGenerate() {
        let data = getLimitData();
        let now = Date.now();

        if (data.startTime && now - data.startTime > WINDOW) {
            data = { count: 0, startTime: null };
            saveLimitData(data);
        }

        return data.count < LIMIT;
    }

    function incrementCounter() {
        let data = getLimitData();
        let now = Date.now();

        if (!data.startTime) {
            data.startTime = now;
        }

        data.count += 1;
        saveLimitData(data);
        updateButtonState();
    }

    function updateButtonState() {
        let data = getLimitData();
        let now = Date.now();

        if (data.startTime && now - data.startTime > WINDOW) {
            data = { count: 0, startTime: null };
            saveLimitData(data);
        }

        let remaining = LIMIT - data.count;

        if (remaining > 0) {
            btn.disabled = false;
            btn.style.background = "";
            btn.textContent = `🚀 Générer DXF (${remaining} restants)`;
            return;
        }

        btn.disabled = true;
        btn.style.background = "gray";

        let end = data.startTime + WINDOW;

        function updateTimer() {
            let diff = end - Date.now();

            if (diff <= 0) {
                localStorage.removeItem("dxf_limit");
                updateButtonState();
                return;
            }

            btn.textContent = `⏳ Réessayer dans ${formatTime(diff)}`;
            setTimeout(updateTimer, 1000);
        }

        updateTimer();
    }

    // GESTION DU FORMULAIRE
    form.addEventListener("submit", function(e) {
        e.preventDefault(); // Empêcher l'envoi normal
        
        // Vérifier la limite
        if (!canGenerate()) {
            alert(`❌ Limite atteinte! Maximum ${LIMIT} téléchargements par 24h.`);
            return;
        }
        
        // Incrémenter le compteur
        incrementCounter();
        
        // Désactiver le bouton
        btn.disabled = true;
        btn.textContent = "⏳ Génération en cours...";
        
        // Envoyer avec fetch
        const formData = new FormData(form);
        
        fetch('/generate_dxf2', {
            method: 'POST',
            body: formData
        })
        .then(response => response.blob())
        .then(blob => {
            // Télécharger le fichier
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'النقاط.dxf';
            a.click();
            URL.revokeObjectURL(url);
            
            // Rediriger
            window.location.href = '/coor';
        })
        .catch(error => {
            console.error('Erreur:', error);
            alert('❌ Erreur lors de la génération du fichier');
            // Réactiver le bouton en cas d'erreur
            updateButtonState();
        });
    });

    // INIT
    updateButtonState();
}
</script>
